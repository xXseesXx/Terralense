[package]
name = "terralens"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "EUPL-1.2 AND GPL-3.0-only"
repository = "https://github.com/xXseesXx/Terralense"
description = "Native Rust TerraFirmaGreg seed atlas"

[features]
default = ["gui"]
gui = []
# Opt-in tools for maintainers; never enabled by build.sh or release CI.
diagnostics = ["gui"]

[[example]]
name = "litter_accuracy"
required-features = ["diagnostics"]

[[example]]
name = "ground_accuracy"
required-features = ["diagnostics"]

[[example]]
name = "accuracy_survey"
required-features = ["diagnostics"]

[[bin]]
name = "terralens"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
ab_glyph = "0.2.32"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
rayon = "1"
crossbeam-channel = "0.5"
lru = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
md5 = "0.8"
sha2 = "0.10"
pollster = "0.4"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[profile.release]
debug = 0
debug-assertions = false
lto = "thin"
codegen-units = 8
strip = true

[[example]]
name = "beneath_validation"
required-features = ["diagnostics"]

[[example]]
name = "streaming"
required-features = ["diagnostics"]

[[example]]
name = "structure_coverage"
required-features = ["diagnostics"]

[[example]]
name = "structure_audit"
required-features = ["diagnostics"]

[[example]]
name = "structure_inspection"
required-features = ["diagnostics"]

[[example]]
name = "structure_accuracy"
required-features = ["diagnostics"]

[[example]]
name = "surface_preview"
required-features = ["diagnostics"]

[[example]]
name = "surface_validation"
required-features = ["diagnostics"]

[[example]]
name = "wayland_background_probe"
required-features = ["diagnostics"]

[[example]]
name = "zoom_streaming"
required-features = ["diagnostics"]

[[example]]
name = "tree_accuracy"
required-features = ["diagnostics"]

[[example]]
name = "tree_fixture_accuracy"
required-features = ["diagnostics"]

[[example]]
name = "surface_profiles"
required-features = ["diagnostics"]

[[example]]
name = "surface_mismatch_audit"
required-features = ["diagnostics"]

[[example]]
name = "dike_site_accuracy"
required-features = ["diagnostics"]
